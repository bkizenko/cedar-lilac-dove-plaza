<!doctype html>
<html><head><meta charset="utf-8"><title>H render preview</title>
<style>html,body{margin:0;background:#000}#wrap{position:relative}canvas{display:block}#ui{position:absolute;left:0;top:0}</style></head>
<body><div id="wrap"><canvas id="gl"></canvas><canvas id="ui"></canvas></div>
<script>
/* Dependency-free WebGL2 preview renderer for Option H carved meshes.
 * NOT three.js and NOT the in-game renderer. It reproduces the shading model
 * the three adapter (src/scene/carvedBuildingLayer.ts) would get from a
 * MeshStandardMaterial with vertex colours x grain map under CARVED_LIGHT_RIG:
 * physically based light units (Lambert = albedo/PI), hemisphere + directional
 * sun + faint bounce, optional PCF shadow map, Khronos PBR Neutral tone map,
 * three-style linear fog, sRGB output. Specular is approximated (roughness
 * ~0.86 -> a small Schlick term), there is no IBL, SSAO or post-processing. */
const PI=Math.PI;
const b64f32=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Float32Array(u.buffer);};
const b64u32=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Uint32Array(u.buffer);};
const b64u8=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
const s2l=c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4);
const hex=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];};
const lin=(h,k=1)=>hex(h).map(c=>s2l(c)*k);

// ---- tiny mat4 (column-major) ----
const M={
 persp(fovy,a,n,f){const t=1/Math.tan(fovy/2),r=new Float32Array(16);r[0]=t/a;r[5]=t;r[10]=(f+n)/(n-f);r[11]=-1;r[14]=2*f*n/(n-f);return r;},
 ortho(l,r_,b,t,n,f){const r=new Float32Array(16);r[0]=2/(r_-l);r[5]=2/(t-b);r[10]=-2/(f-n);r[12]=-(r_+l)/(r_-l);r[13]=-(t+b)/(t-b);r[14]=-(f+n)/(f-n);r[15]=1;return r;},
 look(e,c,u){const z=norm(sub(e,c)),x=norm(cross(u,z)),y=cross(z,x),r=new Float32Array(16);
  r[0]=x[0];r[4]=x[1];r[8]=x[2];r[1]=y[0];r[5]=y[1];r[9]=y[2];r[2]=z[0];r[6]=z[1];r[10]=z[2];r[12]=-dot(x,e);r[13]=-dot(y,e);r[14]=-dot(z,e);r[15]=1;return r;},
 mul(a,b){const r=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];r[i*4+j]=s;}return r;},
 xf(m,p){const x=p[0],y=p[1],z=p[2];const w=m[3]*x+m[7]*y+m[11]*z+m[15];return[(m[0]*x+m[4]*y+m[8]*z+m[12])/w,(m[1]*x+m[5]*y+m[9]*z+m[13])/w,(m[2]*x+m[6]*y+m[10]*z+m[14])/w];}
};
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function norm(a){const l=Math.hypot(...a)||1;return[a[0]/l,a[1]/l,a[2]/l];}

const VS=`#version 300 es
layout(location=0) in vec3 aPos;layout(location=1) in vec3 aNrm;layout(location=2) in vec3 aCol;layout(location=3) in float aGrain;layout(location=4) in vec2 aUv;
uniform mat4 uVP;uniform mat4 uLVP;
out vec3 vPos;out vec3 vNrm;out vec3 vCol;out float vGrain;out vec2 vUv;out vec4 vL;
void main(){vPos=aPos;vNrm=aNrm;vCol=aCol;vGrain=aGrain;vUv=aUv;vL=uLVP*vec4(aPos,1.);gl_Position=uVP*vec4(aPos,1.);}`;
const FS=`#version 300 es
precision highp float;precision highp sampler2DShadow;
in vec3 vPos;in vec3 vNrm;in vec3 vCol;in float vGrain;in vec2 vUv;in vec4 vL;
uniform sampler2D uGrainTex;uniform sampler2DShadow uShadow;uniform float uUseShadow;uniform float uShadowTexel;
uniform vec3 uSunDir,uSun,uSky,uGround,uBounceDir,uBounce,uCam,uFog,uWaterSky;
uniform float uFogNear,uFogFar,uExposure,uSpec,uGrainBoost,uShadowSoft,uSat,uWarm,uHeightAO,uAOBase;
out vec4 o;
float s2l(float c){return c<=.04045?c/12.92:pow((c+.055)/1.055,2.4);}
vec3 s2l(vec3 c){return vec3(s2l(c.r),s2l(c.g),s2l(c.b));}
float l2s(float c){return c<=.0031308?c*12.92:1.055*pow(c,1./2.4)-.055;}
vec3 neutral(vec3 color){ // Khronos PBR Neutral (as three NeutralToneMapping)
 const float startCompression=0.8-0.04;const float desaturation=0.15;
 color*=uExposure;float x=min(color.r,min(color.g,color.b));float offset=x<0.08?x-6.25*x*x:0.04;color-=offset;
 float peak=max(color.r,max(color.g,color.b));if(peak<startCompression)return color;
 float d=1.-startCompression;float newPeak=1.-d*d/(peak+d-startCompression);color*=newPeak/peak;
 float g=1.-1./(desaturation*(peak-newPeak)+1.);return mix(color,vec3(newPeak),g);}
float shadow(vec3 n){
 if(uUseShadow<.5)return 1.;vec3 p=vL.xyz/vL.w*.5+.5;if(p.x<0.||p.x>1.||p.y<0.||p.y>1.||p.z>1.)return 1.;
 float bias=.0006+.0016*(1.-max(dot(n,uSunDir),0.));float s=0.;float r=uShadowSoft;
 for(int i=-2;i<=2;i++)for(int j=-2;j<=2;j++)s+=texture(uShadow,vec3(p.xy+vec2(i,j)*uShadowTexel*r,p.z-bias));
 return s/25.;}
void main(){
 vec3 n=normalize(vNrm);
 bool water=vGrain<-.5;
 vec3 base=s2l(clamp(vCol,0.,1.));
 if(!water){vec3 g=texture(uGrainTex,vUv).rgb;g=1.-(1.-g)*uGrainBoost;base*=mix(vec3(1.),g,clamp(vGrain,0.,1.));}
 // optional saturation/warmth grade on albedo (tuned rig only; 1/0 = identity)
 float lum=dot(base,vec3(.2126,.7152,.0722));base=max(vec3(0.),mix(vec3(lum),base,uSat));base*=vec3(1.+uWarm,1.,1.-uWarm*1.4);
 float ao=mix(uAOBase,1.,clamp(vPos.y*uHeightAO,0.,1.));if(uHeightAO<=0.)ao=1.;
 float sh=shadow(n);
 float ndl=max(dot(n,uSunDir),0.);
 vec3 hemi=mix(uGround,uSky,.5*n.y+.5);
 vec3 irr=hemi*ao+uSun*ndl*sh+uBounce*max(dot(n,uBounceDir),0.)*ao;
 vec3 col=base*irr/3.14159265;
 vec3 v=normalize(uCam-vPos);
 if(water){float f=.04+.96*pow(1.-max(dot(n,v),0.),5.);col=mix(col,uWaterSky,clamp(f*1.6,0.,.55));vec3 h=normalize(uSunDir+v);col+=uSun*pow(max(dot(n,h),0.),60.)*.012*sh;}
 else{vec3 h=normalize(uSunDir+v);float spec=pow(max(dot(n,h),0.),6.)*uSpec*ndl*sh;col+=uSun*spec*.04;}
 col=neutral(col);
 vec3 srgb=vec3(l2s(clamp(col.r,0.,1.)),l2s(clamp(col.g,0.,1.)),l2s(clamp(col.b,0.,1.)));
 float depth=length(uCam-vPos);float fog=smoothstep(uFogNear,uFogFar,depth);
 o=vec4(mix(srgb,uFog,fog),1.);}`;
const SVS=`#version 300 es
layout(location=0) in vec3 aPos;uniform mat4 uLVP;void main(){gl_Position=uLVP*vec4(aPos,1.);}`;
const SFS=`#version 300 es
precision mediump float;out vec4 o;void main(){o=vec4(1.);}`;

function prog(gl,vs,fs){const p=gl.createProgram();for(const [t,s] of[[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh);}gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}

window.renderScene=function(S){
 const W=S.width,H=S.height,cv=document.getElementById('gl'),ui=document.getElementById('ui');
 const dpr=S.pixelRatio||1;cv.width=ui.width=W*dpr;cv.height=ui.height=H*dpr;cv.style.width=ui.style.width=W+'px';cv.style.height=ui.style.height=H+'px';
 const gl=cv.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});if(!gl)throw new Error('no webgl2');
 const P=prog(gl,VS,FS),SP=prog(gl,SVS,SFS);
 // meshes
 const meshes=S.meshes.map(m=>{const vao=gl.createVertexArray();gl.bindVertexArray(vao);
  const attr=(loc,data,size)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0);};
  const pos=b64f32(m.pos);attr(0,pos,3);attr(1,b64f32(m.nrm),3);attr(2,b64f32(m.col),3);attr(3,b64f32(m.grain),1);attr(4,b64f32(m.uv),2);
  let count=pos.length/3,indexed=false;if(m.idx){const ib=gl.createBuffer(),idx=b64u32(m.idx);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);count=idx.length;indexed=true;}
  gl.bindVertexArray(null);return{vao,count,indexed,cast:m.cast!==false};});
 // grain texture
 const gt=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,gt);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,S.grain.size,S.grain.size,0,gl.RGBA,gl.UNSIGNED_BYTE,b64u8(S.grain.pixels));
 gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 const af=gl.getExtension('EXT_texture_filter_anisotropic');if(af)gl.texParameterf(gl.TEXTURE_2D,af.TEXTURE_MAX_ANISOTROPY_EXT,4);
 // camera
 const C=S.camera,aspect=W/H;let proj;
 if(C.ortho)proj=M.ortho(-C.ortho*aspect,C.ortho*aspect,-C.ortho,C.ortho,C.near||1,C.far||2000);else proj=M.persp(C.fov*PI/180,aspect,C.near||1,C.far||2000);
 const view=M.look(C.eye,C.target,[0,1,0]),VP=M.mul(proj,view);
 // light
 const R=S.rig,sunDir=norm(R.sunDir),sc=S.shadow||{center:C.target,radius:120};
 const le=[sc.center[0]+sunDir[0]*400,sc.center[1]+sunDir[1]*400,sc.center[2]+sunDir[2]*400];
 const LVP=M.mul(M.ortho(-sc.radius,sc.radius,-sc.radius,sc.radius,1,900),M.look(le,sc.center,Math.abs(sunDir[1])>.99?[0,0,1]:[0,1,0]));
 const SM=4096,st=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,st);gl.texStorage2D(gl.TEXTURE_2D,1,gl.DEPTH_COMPONENT32F,SM,SM);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_MODE,gl.COMPARE_REF_TO_TEXTURE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_FUNC,gl.LEQUAL);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 const fb=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,st,0);
 gl.viewport(0,0,SM,SM);gl.clear(gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.useProgram(SP);gl.uniformMatrix4fv(gl.getUniformLocation(SP,'uLVP'),false,LVP);
 if(R.shadows)for(const m of meshes){if(!m.cast)continue;gl.bindVertexArray(m.vao);m.indexed?gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_INT,0):gl.drawArrays(gl.TRIANGLES,0,m.count);}
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);
 // main pass
 gl.viewport(0,0,cv.width,cv.height);const bg=hex(S.background||'#e8c79a');gl.clearColor(bg[0],bg[1],bg[2],1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.useProgram(P);const U=n=>gl.getUniformLocation(P,n);
 gl.uniformMatrix4fv(U('uVP'),false,VP);gl.uniformMatrix4fv(U('uLVP'),false,LVP);
 gl.uniform3fv(U('uSunDir'),sunDir);gl.uniform3fv(U('uSun'),lin(R.sun,R.sunIntensity));gl.uniform3fv(U('uSky'),lin(R.hemiSky,R.hemiIntensity));gl.uniform3fv(U('uGround'),lin(R.hemiGround,R.hemiIntensity));
 gl.uniform3fv(U('uBounceDir'),norm(R.bounceDir||[-sunDir[0],.3,-sunDir[2]]));gl.uniform3fv(U('uBounce'),lin(R.bounce,R.bounceIntensity));
 gl.uniform3fv(U('uCam'),C.eye);gl.uniform3fv(U('uFog'),hex(R.fog));gl.uniform1f(U('uFogNear'),R.fogNearMetres);gl.uniform1f(U('uFogFar'),R.fogFarMetres);gl.uniform3fv(U('uWaterSky'),lin(R.waterSky||'#cfd6d2'));
 gl.uniform1f(U('uExposure'),R.exposure);gl.uniform1f(U('uSpec'),R.spec??1);gl.uniform1f(U('uGrainBoost'),R.grainBoost??1);gl.uniform1f(U('uSat'),R.albedoSat??1);gl.uniform1f(U('uWarm'),R.albedoWarm??0);
 gl.uniform1f(U('uHeightAO'),R.heightAO??0);gl.uniform1f(U('uAOBase'),R.aoBase??1);
 gl.uniform1f(U('uUseShadow'),R.shadows?1:0);gl.uniform1f(U('uShadowTexel'),1/SM);gl.uniform1f(U('uShadowSoft'),R.shadowSoft??1.5);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,gt);gl.uniform1i(U('uGrainTex'),0);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,st);gl.uniform1i(U('uShadow'),1);
 for(const m of meshes){gl.bindVertexArray(m.vao);m.indexed?gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_INT,0):gl.drawArrays(gl.TRIANGLES,0,m.count);}
 gl.finish();
 // overlay labels
 const c2=ui.getContext('2d');c2.scale(dpr,dpr);
 for(const L of S.labels||[]){let x,y;if(L.world){const p=M.xf(VP,L.world);if(p[2]>1)continue;x=(p[0]*.5+.5)*W;y=(1-(p[1]*.5+.5))*H;}else{x=L.x;y=L.y;}
  c2.font=`${L.weight||600} ${L.size||11}px ui-sans-serif, DejaVu Sans, sans-serif`;c2.textAlign=L.align||'center';c2.textBaseline='middle';
  if(L.box!==false){const w=c2.measureText(L.text).width+8,h=(L.size||11)+6,bx=c2.textAlign==='center'?x-w/2:c2.textAlign==='left'?x-4:x-w+4;c2.fillStyle=L.bg||'rgba(52,30,12,.72)';c2.fillRect(bx,y-h/2,w,h);}
  c2.fillStyle=L.color||'#fbeedb';c2.fillText(L.text,x,y);}
 return {ok:true,meshes:meshes.length,tris:meshes.reduce((s,m)=>s+m.count/3,0)};
};
</script></body></html>
