body{background:#5f7a43 url(terrain-close.jpg) center/cover}
.top{position:absolute;left:14px;top:14px;display:flex;gap:8px}

.cell svg{width:40px;height:40px}.cell b{font-size:32px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1}

.pin{position:absolute;display:grid;justify-items:center;transform:translate(-50%,-100%)}
.pin .b{width:60px;height:60px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);display:grid;place-items:center;border:3px solid var(--parch);box-shadow:0 5px 0 rgba(0,0,0,.45)}

.fig{position:absolute;width:18px;height:32px;border-radius:9px 9px 4px 4px;background:#2a2016;transform:translate(-50%,-100%)}
.fig.s{box-shadow:0 0 0 3px var(--gold-2)}
.sel{position:absolute;left:14px;bottom:112px;width:440px;padding:14px;display:grid;gap:12px}
.hd{display:flex;align-items:center;gap:12px}.hd .t{flex:1;display:grid;gap:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.act{display:flex;gap:10px;align-items:center}.sp{flex:1}
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:6px;padding:8px}
.d{width:92px;height:76px;border-radius:14px;display:grid;place-items:center;align-content:center;gap:3px;font-weight:700;font-size:16px;color:var(--text)}
.d svg{width:38px;height:38px;color:var(--gold-2)}.d.on{background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #8a5c1f}.d.on svg{color:var(--ink)}

.n .medal{width:48px;height:48px;background:#b94a30;border-color:#7d2c18;color:#fff}.n .medal svg{width:28px;height:28px}
.n .go{margin-left:auto;background:var(--wood-800);color:var(--text);border-radius:10px;min-height:48px;width:56px;display:grid;place-items:center}
.tray{display:flex;gap:8px;justify-content:flex-end}.tray .chip{background:var(--parch);color:var(--ink);border-color:rgba(43,32,22,.3)}
.ov{position:absolute;right:14px;bottom:14px;display:grid;gap:8px}
.mm{width:300px;height:230px;padding:8px}.mm div{width:100%;height:100%;border-radius:12px;border:2px solid rgba(227,173,79,.6);background:#2a3a2c url(terrain-wide.jpg) center/cover;position:relative}

.hot{position:absolute;left:14px;top:96px;display:grid;gap:8px;padding:6px}
