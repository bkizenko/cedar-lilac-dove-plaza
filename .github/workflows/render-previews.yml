name: render-previews
# Option H preview renders from the real generator output (src/scene).
# Three backends: stand-in WebGL2 (tools/render-preview/render.mjs), real
# three.js 0.185.1 (render-three.mjs) and Blender Cycles (tools/blender/run.mjs).
# All are previews, not in-game screenshots. PNGs are uploaded as artifacts only.
on:
  workflow_dispatch:
    inputs:
      blender_samples:
        description: Cycles samples per pixel (hero shot uses at least 128)
        default: '96'
  push:
    branches: [agents/claude-experience-render]
    paths:
      - 'tools/render-preview/**'
      - 'tools/blender/**'
      - '.github/workflows/render-previews.yml'

permissions:
  contents: read

concurrency:
  group: render-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webgl:
    name: stand-in + three.js
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Stand-in WebGL2 renders
        run: node tools/render-preview/render.mjs all docs/art-reference/h-renders/standin
      - name: three.js renders
        run: node tools/render-preview/render-three.mjs all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-renders-webgl
          path: docs/art-reference/h-renders/**
          retention-days: 7
          if-no-files-found: warn

  blender:
    name: Blender Cycles
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CI: 'true'
      BLENDER_VERSION: '4.2.3'
      BLENDER_SERIES: '4.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install Blender (official tarball, pinned)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxrender1 libxxf86vm1 libxfixes3 libxext6 libx11-6
          curl -fsSL -o /tmp/blender.tar.xz "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p "$HOME/blender" && tar -xJf /tmp/blender.tar.xz -C "$HOME/blender" --strip-components=1
          "$HOME/blender/blender" --version
      - name: Export + Cycles render + labels
        run: |
          export BLENDER="$HOME/blender/blender"
          node tools/blender/run.mjs --samples=${{ github.event.inputs.blender_samples || '96' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-renders-blender
          path: docs/art-reference/h-renders/**
          retention-days: 7
          if-no-files-found: warn
